<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
  <link rel="apple-touch-icon" href="/icons/pwa/icon-192.png?v=2" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MiSub" />
  <title>MiSub</title>
  <meta property="og:title" content="MiSub" />
  <meta property="og:description" content="基于 Cloudflare 的订阅转换和管理工具" />
  <meta property="og:site_name" content="MiSub" />
  <meta property="og:image" content="https://sub.dmorz.com/logo.png" />
  <meta name="description" content="基于 Cloudflare 的订阅转换和管理工具" />
  <meta name="theme-color" content="#f7f8f8" />
  <style>
    html {
      background: var(--bg-page-light, #f7f8f8);
      color-scheme: light;
    }
    html.dark {
      background: var(--bg-page-dark, #08090a);
      color-scheme: dark;
    }
  </style>
  <script id="misub-theme-bootstrap" data-cfasync="false">
    (function () {
      let savedTheme = null;
      try {
        savedTheme = localStorage.getItem('theme');
      } catch (_) {}
      const isDark = savedTheme === 'dark';
      document.documentElement.classList.toggle('dark', isDark);
      const color = isDark ? '#08090a' : '#f7f8f8';
      document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
        meta.setAttribute('content', color);
      });
    })();
  </script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
